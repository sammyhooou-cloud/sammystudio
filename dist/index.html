<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050606" />
    <meta name="description" content="可灵工作台的安全登录入口。" />
    <title>可灵工作台 · 登录</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23050606'/%3E%3Cpath d='M18 16v32M18 33l24-17M18 33l25 15' fill='none' stroke='%23b7f46b' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="stage">
      <header class="masthead" aria-label="页面信息">
        <p><span>界面</span> 可灵工作台</p>
        <p class="wordmark" aria-label="可灵">K</p>
        <p><span>节点</span> 01 · 登录</p>
      </header>

      <section class="interface-wrap" aria-label="可灵工作台登录窗口">
        <div class="interface-shell">
          <div class="interface-screen">
            <section class="login-panel">
              <div class="panel-copy">
                <p class="eyebrow">KELING WORKSPACE</p>
                <h1>欢迎回来</h1>
                <p>进入你的智能创作空间</p>
              </div>

              <div id="form-view">
                <form id="login-form" novalidate>
                  <div class="field-group">
                    <label for="username">用户名</label>
                    <input id="username" name="username" type="text" autocomplete="username" placeholder="输入用户名" aria-describedby="username-error" aria-invalid="false" />
                    <p class="field-error" id="username-error" aria-live="polite"></p>
                  </div>
                  <div class="field-group">
                    <label for="password">密码</label>
                    <div class="password-field">
                      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="至少 6 个字符" aria-describedby="password-error" aria-invalid="false" />
                      <button id="password-toggle" class="password-toggle" type="button" aria-label="显示密码" aria-pressed="false"><span>显示</span></button>
                    </div>
                    <p class="field-error" id="password-error" aria-live="polite"></p>
                  </div>
                  <button id="login-submit" class="login-button" type="submit">
                    <span class="button-label">登录工作台</span><span aria-hidden="true">↗</span>
                  </button>
                </form>
              </div>

              <div id="success-view" class="success-view" tabindex="-1" hidden>
                <div class="success-mark" aria-hidden="true">✓</div>
                <h2>身份已验证</h2>
                <p>工作台将在后续节点开放。</p>
              </div>
            </section>

            <section class="models" aria-labelledby="models-title">
              <div class="models-heading">
                <div><p>AVAILABLE</p><h2 id="models-title">可用模型</h2></div>
                <span class="live-dot"><i></i> 在线</span>
              </div>
              <div class="model-window">
                <div class="model-track">
                  <div class="model-row"><span class="model-icon chatgpt">◉</span><div><strong>ChatGPT</strong><small>语言与推理</small></div><b>01</b></div>
                  <div class="model-row"><span class="model-icon minimax">M</span><div><strong>Minimax</strong><small>多模态生成</small></div><b>02</b></div>
                  <div class="model-row"><span class="model-icon keling">K</span><div><strong>Keling / 可灵</strong><small>视频与视觉</small></div><b>03</b></div>
                  <div class="model-row" aria-hidden="true"><span class="model-icon chatgpt">◉</span><div><strong>ChatGPT</strong><small>语言与推理</small></div><b>01</b></div>
                  <div class="model-row" aria-hidden="true"><span class="model-icon minimax">M</span><div><strong>Minimax</strong><small>多模态生成</small></div><b>02</b></div>
                  <div class="model-row" aria-hidden="true"><span class="model-icon keling">K</span><div><strong>Keling / 可灵</strong><small>视频与视觉</small></div><b>03</b></div>
                </div>
              </div>
            </section>
          </div>
        </div>
      </section>
      <p class="footnote">A QUIET ENTRY INTO CREATIVE INTELLIGENCE</p>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
