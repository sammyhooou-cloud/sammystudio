<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070907"><meta name="description" content="可灵视频生成工作台">
  <title>可灵工作台 · 视频生成</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/project-navigation.css"><link rel="stylesheet" href="/image-preview.css"><link rel="stylesheet" href="/task-history.css">
</head>
<body class="workspace-page">
  <main class="stage">
    <video class="stage-video" aria-hidden="true" tabindex="-1" muted autoplay loop playsinline preload="metadata" poster="/assets/alpine-runner.jpg">
      <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260521_014404_fadafdb1-4df6-4699-be9c-77d25f39a3d0.mp4" type="video/mp4">
    </video>
    <header class="masthead"><p><span>WORKSPACE</span>可灵工作台</p><b>K</b><p><span>MODULE 01</span>视频生成</p></header>
    <section id="workspace-view" class="workspace">
      <button id="project-drawer-toggle" class="project-drawer-toggle" type="button" aria-expanded="false" aria-controls="project-sidebar"><span>项目</span><strong id="mobile-project-name">—</strong></button>
      <div id="project-backdrop" class="project-backdrop" hidden></div>
      <div class="workspace-shell">
        <aside id="project-sidebar" class="project-sidebar" aria-label="项目导航">
          <div class="project-sidebar-head"><div><p class="eyebrow">PROJECTS</p><h2>项目</h2></div><div class="project-sidebar-actions"><button id="new-project" class="project-add" type="button" aria-label="新建项目">＋</button><button id="sidebar-collapse" class="project-collapse" type="button" aria-expanded="true" aria-controls="project-list" aria-label="收起项目导航">‹</button></div></div>
          <form id="create-project-form" class="project-inline-form" hidden><label for="new-project-name">项目名称</label><input id="new-project-name" maxlength="60" autocomplete="off" required><div><button class="project-save" type="submit">创建</button><button id="cancel-create-project" class="project-cancel" type="button">取消</button></div></form>
          <nav id="project-list" class="project-list" aria-label="项目列表"></nav>
          <button id="rename-project-mobile" class="project-item" type="button"><span>✎</span><strong>重命名当前项目</strong></button>
          <p id="project-error" class="error" aria-live="assertive" tabindex="-1"></p>
          <button id="workspace-retry" class="project-item" type="button" hidden><span>↻</span><strong>重试加载</strong></button>
        </aside>
        <div class="workspace-main" tabindex="-1">
          <header class="workspace-head"><div><p class="eyebrow">VIDEO GENERATION</p><h1>生成动态想象</h1><p class="current-project-line">当前项目 <strong id="current-project-name">—</strong><button id="rename-project" type="button">重命名</button></p><form id="rename-project-form" class="rename-project-form" hidden><input id="rename-project-name" maxlength="60" aria-label="新项目名称" required><button type="submit">保存</button><button id="cancel-rename-project" type="button">取消</button></form></div><div class="account-strip"><div class="status"><i id="status-light"></i><span id="status-text">正在检测</span></div><div id="membership-field"><small>会员</small><strong id="membership">—</strong></div><div><small id="balance-title">点数余额</small><strong id="credits">—</strong></div><button id="refresh-status" class="icon-button" title="刷新状态">↻</button><button id="logout" class="text-button">退出</button></div></header>
          <div class="workspace-grid">
            <form id="generator-form" class="generator panel">
              <fieldset class="provider-switch" aria-label="视频生成服务"><legend>生成服务</legend><button type="button" data-provider="kling" aria-pressed="true">可灵</button><button type="button" data-provider="minimax" aria-pressed="false">MiniMax</button></fieldset>
              <div class="mode-tabs"><button type="button" class="active" data-mode="text" aria-pressed="true">文生视频</button><button type="button" data-mode="image" aria-pressed="false">图生视频</button></div>
              <label class="wide">提示词<textarea id="prompt" rows="5" placeholder="描述镜头、主体、动作、光线与氛围"></textarea></label>
              <div id="upload-field" class="upload wide" hidden><input id="reference-image" type="file" accept="image/jpeg,image/png,image/webp" aria-label="选择首帧参考图"><label id="upload-copy" for="reference-image">＋ 上传首帧参考图<br><small>JPG / PNG / WebP，最大 15MB</small></label><div id="image-preview" class="image-preview" hidden><img id="image-preview-img" alt=""><div class="image-preview-info"><strong id="image-preview-name"></strong><small id="image-preview-details"></small><span id="image-preview-status" aria-live="polite"></span></div><div class="image-preview-actions"><button id="replace-image" type="button">更换图片</button><button id="remove-image" type="button">移除图片</button></div></div></div>
              <label>模型<select id="model"></select></label><label>分辨率<select id="resolution"></select></label><label>视频时长<select id="duration"></select></label><label id="aspect-ratio-field"><span id="aspect-ratio-label">画幅</span><select id="aspect-ratio"></select></label>
              <p id="form-error" class="error wide" aria-live="polite"></p><button id="generate" class="primary wide" type="submit">开始生成 <span>↗</span></button>
            </form>
            <aside class="result panel">
              <div class="result-head"><div><p class="eyebrow">CURRENT TASK</p><h2 id="result-heading" tabindex="-1">生成结果</h2></div><div class="result-head-actions"><span id="task-state" aria-live="polite">等待提交</span><button id="return-current-task" type="button" aria-controls="result-stage" hidden>返回当前任务</button></div></div>
              <div id="result-stage" class="result-stage">
                <div id="result-empty" class="result-layer empty"><b>◌</b><p>设置参数并提交后，任务进度与视频将在这里出现。</p></div>
                <div id="result-progress" class="result-layer generation-state" hidden><div class="generation-visual" aria-hidden="true"></div><h3 id="generation-title">生成中</h3><p id="task-progress" class="task-progress" hidden></p><p id="task-id" class="task-id"></p></div>
                <div id="result-terminal" class="result-layer terminal-state" hidden><h3 id="terminal-title"></h3><p id="terminal-copy"></p></div>
                <video id="result-video" controls hidden></video>
              </div>
              <div id="task-history-wrap" class="task-history-wrap" hidden><p class="eyebrow">任务记录</p><div id="task-history" class="task-history"></div></div>
            </aside>
          </div>
          <p id="last-check" class="last-check">尚未连接</p>
        </div>
      </div>
    </section>
  </main><script type="module" src="/app.7006d7f8a647.js"></script>
</body></html>
